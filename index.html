<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GringoSafe • Premium AI Intelligence</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#FFFFFF">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="./logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">

    <link href='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css' rel='stylesheet' />
    <script src='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js'></script>

    <style>
        :root {
            --brand-primary: #10B981; /* Emerald Tech */
            --brand-secondary: #6366F1; /* Indigo SaaS */
            --brand-accent: #F59E0B; /* Gold Premium */
            --bg-glass: rgba(255, 255, 255, 0.82);
            --text-main: #0F172A;
            --text-muted: #64748B;
            --border-glass: rgba(255, 255, 255, 0.4);
            --shadow-float: 0 20px 30px -10px rgba(0, 0, 0, 0.1);
            --radius-ui: 24px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body, html { 
            font-family: 'Inter', sans-serif; 
            background-color: #FFFFFF; 
            color: var(--text-main);
            height: 100%; width: 100%; overflow: hidden;
        }

        /* --- UI LAYER: MAPA --- */
        #mapa { position: absolute; inset: 0; z-index: 0; }

        /* --- COMPONENTE: SPLASH SCREEN --- */
        #splashScreen { 
            position: fixed; inset: 0; background: #FFFFFF; z-index: 10000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.8s ease-in-out;
        }
        #splashScreen h1 {
            font-family: 'Poppins', sans-serif; font-size: 36px; font-weight: 800;
            background: linear-gradient(135deg, var(--brand-primary), var(--brand-secondary));
            background-clip: text; -webkit-background-clip: text;
            color: transparent; -webkit-text-fill-color: transparent;
        }

        /* --- COMPONENTE: ILHAS FLUTUANTES (GLASS) --- */
        .glass-island {
            background: var(--bg-glass);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid var(--border-glass);
            box-shadow: var(--shadow-float);
        }

        /* TOP NAVIGATION */
        .header-island {
            position: fixed; top: 15px; left: 50%; transform: translateX(-50%);
            width: calc(100% - 30px); max-width: 500px; height: 64px;
            border-radius: var(--radius-ui); display: flex; align-items: center;
            padding: 0 20px; z-index: 5000; justify-content: space-between;
        }
        .brand-logo { font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 18px; display: flex; align-items: center; gap: 8px; }
        .brand-logo b { color: var(--brand-primary); }

        .balance-pill {
            background: white; padding: 8px 16px; border-radius: 40px;
            font-weight: 600; font-size: 13px; color: var(--brand-primary);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        /* BOTTOM ACTION DOCK */
        .action-dock {
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%);
            display: flex; align-items: center; gap: 12px; padding: 12px;
            border-radius: 40px; z-index: 6000;
        }
        .btn-dock {
            width: 56px; height: 56px; border-radius: 50%; border: none;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .btn-dock:active { transform: scale(0.88); }
        .btn-dock-main {
            width: 68px; height: 68px; 
            background: linear-gradient(135deg, var(--brand-primary), #059669);
            color: white; box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
        }
        .btn-dock-util { background: white; color: var(--text-main); font-size: 20px; }

        /* --- MODALS (Premium Sheet) --- */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.2);
            backdrop-filter: blur(8px); display: none; align-items: flex-end; 
            justify-content: center; z-index: 9000; padding: 10px;
        }
        .modal-sheet {
            width: 100%; max-width: 480px; background: white;
            border-radius: 32px; padding: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.2);
            animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        /* BENTO ELEMENTS */
        .bento-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
        .bento-card { background: #F8FAFC; border-radius: 20px; padding: 18px; border: 1px solid #F1F5F9; }

        .input-premium {
            width: 100%; background: #F8FAFC; border: 2px solid transparent;
            border-radius: 18px; padding: 18px; font-family: inherit; font-size: 15px;
            transition: all 0.3s; margin-top: 10px;
        }
        .input-premium:focus { border-color: var(--brand-primary); background: white; outline: none; }

        /* --- CUSTOM MARKERS --- */
        .marker-premium {
            width: 32px; height: 32px; border-radius: 50%;
            background: var(--brand-accent); border: 4px solid white;
            box-shadow: 0 10px 20px rgba(245, 158, 11, 0.4);
            display: flex; align-items: center; justify-content: center;
        }
        .marker-base {
            width: 24px; height: 24px; border-radius: 50%;
            background: var(--brand-primary); border: 4px solid white;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }

        /* Ocultar elementos padrão Mapbox */
        .mapboxgl-ctrl-bottom-left, .mapboxgl-ctrl-bottom-right { display: none !important; }
    </style>
</head>
<body>

    <div id="splashScreen">
        <h1>GringoSafe</h1>
        <p style="color: var(--text-muted); font-size: 13px; font-weight: 500; letter-spacing: 2px; margin-top: 10px;">ESTÁVEL • AI DRIVEN</p>
    </div>

    <div id="mapa"></div>

    <nav class="header-island glass-island">
        <div class="brand-logo" id="btnAbrirMenu">
            <span style="font-size: 20px;">☰</span>
            <b>Gringo</b>Safe
        </div>
        <div class="balance-pill" id="saldoDisplay">R$ 0,00</div>
    </nav>

    <div class="action-dock glass-island">
        <button class="btn-dock btn-dock-util" id="btnRadar">📡</button>
        <button class="btn-dock btn-dock-main" id="btnAdicionar">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
        <button class="btn-dock btn-dock-util" id="btnAbrirBusca">🔍</button>
    </div>

    <div class="modal-overlay" id="modalBusca">
        <div class="modal-sheet">
            <h2 style="font-family: 'Poppins'; font-size: 24px; letter-spacing: -0.5px;">Explorar agora</h2>
            <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 20px;">Preços reais verificados por quem mora aqui.</p>
            
            <input type="text" id="inputBusca" class="input-premium" placeholder="Ex: Quiosque, Água, Passeio...">
            
            <div class="bento-grid">
                <div class="bento-card" style="grid-column: span 2; background: #ECFDF5; border-color: #D1FAE5;">
                    <span style="font-size: 11px; font-weight: 700; color: var(--brand-primary); text-transform: uppercase;">Insights da Comunidade</span>
                    <div id="estimativaIA" style="font-weight: 600; margin-top: 5px;">Aguardando pesquisa...</div>
                </div>
                <div id="resultadosBusca" style="grid-column: span 2;">
                    </div>
            </div>
            
            <button class="input-premium" style="background:none; color:var(--text-muted); font-weight:600; margin-top: 15px;" id="btnFecharBusca">Voltar ao mapa</button>
        </div>
    </div>

    <div class="modal-overlay" id="modalForm">
        <div class="modal-sheet">
            <h2 style="font-family: 'Poppins';">Novo Registro</h2>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px;">
                <div class="bento-card" style="text-align: center; cursor: pointer;">📸 Câmera</div>
                <div class="bento-card" style="text-align: center; cursor: pointer;">🖼️ Galeria</div>
            </div>
            <input type="text" id="nomeProduto" class="input-premium" placeholder="Nome do Produto">
            <input type="number" id="precoProduto" class="input-premium" placeholder="Preço Cobrado">
            
            <button class="input-premium" style="background:var(--brand-primary); color:white; font-weight:700; margin-top: 20px;" id="btnSalvar">Confirmar e Ganhar</button>
            <button class="input-premium" style="background:none; color:var(--text-muted);" id="btnCancelar">Cancelar</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // MANTENDO SEUS TOKENS ORIGINAIS
        const firebaseConfig = { apiKey: "AIzaSyDFsKM3nO9kMqOfqNkUL5rW3ukS4yzzTzs", authDomain: "gringosafe-1f434.firebaseapp.com", projectId: "gringosafe-1f434", storageBucket: "gringosafe-1f434.firebasestorage.app", messagingSenderId: "949745647794", appId: "1:949745647794:web:e81698e40bd8d7aa5d09ab" };
        mapboxgl.accessToken = 'pk.eyJ1IjoiZmFocGxheTE1IiwiYSI6ImNtbXk2Z3UzMDB2YnYyb3BsMTA2ZzV2NmkifQ.Tvdrpof80mAktc3Z3dB3cw';

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Inicializar Mapa Colorido 2D (Mais estável)
        window.mapa = new mapboxgl.Map({
            container: 'mapa',
            style: 'mapbox://styles/mapbox/streets-v12', 
            center: [-43.2302, -22.9121], 
            zoom: 15.5
        });

        // Interface Control
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splashScreen');
                splash.style.opacity = '0';
                setTimeout(() => splash.style.display = 'none', 800);
            }, 1800);
        });

        const toggleModal = (id, show) => document.getElementById(id).style.display = show ? 'flex' : 'none';
        
        document.getElementById('btnAdicionar').onclick = () => toggleModal('modalForm', true);
        document.getElementById('btnCancelar').onclick = () => toggleModal('modalForm', false);
        document.getElementById('btnAbrirBusca').onclick = () => toggleModal('modalBusca', true);
        document.getElementById('btnFecharBusca').onclick = () => toggleModal('modalBusca', false);

        // Puxar dados e desenhar pinos premium
        onSnapshot(collection(db, "precos"), (snapshot) => {
            snapshot.forEach((doc) => {
                const item = doc.data();
                if(!item.lat || !item.lng) return;

                const el = document.createElement('div');
                el.className = item.premium ? 'marker-premium' : 'marker-base';
                if(item.premium) el.innerHTML = '⭐';

                new mapboxgl.Marker(el)
                    .setLngLat([parseFloat(item.lng), parseFloat(item.lat)])
                    .setPopup(new mapboxgl.Popup({ offset: 25 }).setHTML(`
                        <div style="padding: 5px; font-family: 'Inter';">
                            <strong style="display:block; font-size:15px; margin-bottom:4px;">${item.local}</strong>
                            <span style="color:var(--brand-primary); font-weight:800; font-size:18px;">R$ ${parseFloat(item.preco).toFixed(2)}</span>
                        </div>
                    `))
                    .addTo(window.mapa);
            });
        });

    </script>
</body>
</html>
