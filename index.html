<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GringoSafe</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="modo-turista">
    <div id="map" class="map-background"></div>
    
    <header class="header-island">
        <div class="header-content">
            <div class="logo">
                <span>GringoSafe</span>
            </div>
            <div class="profile-switcher">
                <button class="profile-btn active" data-profile="turista">
                    <i class="fas fa-user"></i>
                </button>
                <button class="profile-btn" data-profile="avaliador">
                    <i class="fas fa-star"></i>
                </button>
                <button class="profile-btn" data-profile="lojista">
                    <i class="fas fa-store"></i>
                </button>
            </div>
            <div class="user-info hidden">
                <div class="balance">R$ 0,00</div>
                <div class="level">Nível 1</div>
            </div>
        </div>
    </header>

    <div class="actions-island" id="touristActions">
        <button class="action-btn primary" id="askPriceBtn">
            <i class="fas fa-question-circle"></i>
            <span>Perguntar Preço</span>
        </button>
    </div>

    <div class="actions-island hidden" id="evaluatorActions">
        <button class="action-btn primary" id="addPriceBtn">
            <i class="fas fa-plus-circle"></i>
            <span>Adicionar Preço</span>
        </button>
    </div>

    <div class="notification-toast hidden" id="notificationToast">
        <div class="toast-content">
            <i class="fas fa-check-circle"></i>
            <span class="toast-message">Mensagem de sucesso</span>
        </div>
    </div>

    <div class="modals-container">
        <div class="modal-overlay hidden" id="askPriceModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Perguntar sobre Preço</h3>
                    <button class="close-btn" onclick="closeModal('askPriceModal')">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label>Produto</label>
                        <input type="text" id="productQuestion" placeholder="Ex: Água mineral 500ml">
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn-secondary" onclick="closeModal('askPriceModal')">Cancelar</button>
                    <button class="btn-primary" onclick="submitQuestion()">Enviar</button>
                </div>
            </div>
        </div>

        <div class="modal-overlay hidden" id="addPriceModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Adicionar Preço</h3>
                    <button class="close-btn" onclick="closeModal('addPriceModal')">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label>Produto</label>
                        <input type="text" id="productName" placeholder="Nome do produto">
                    </div>
                    <div class="form-group">
                        <label>Preço</label>
                        <input type="number" id="productPrice" placeholder="R$ 0,00">
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn-secondary" onclick="closeModal('addPriceModal')">Cancelar</button>
                    <button class="btn-primary" onclick="submitPrice()">Adicionar</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        console.log("Starting GringoSafe...");
        
        window.GringoSafe = {
            utils: {
                showNotification: function(msg) {
                    console.log("Notification:", msg);
                    const toast = document.getElementById('notificationToast');
                    document.querySelector('.toast-message').textContent = msg;
                    toast.classList.remove('hidden');
                    setTimeout(() => toast.classList.add('hidden'), 3000);
                }
            },
            app: {
                init: function() {
                    console.log("Initializing app...");
                    
                    // Ask Price Button
                    const askBtn = document.getElementById('askPriceBtn');
                    if (askBtn) {
                        askBtn.onclick = () => {
                            console.log("Ask Price clicked!");
                            document.getElementById('askPriceModal').classList.remove('hidden');
                        };
                    }
                    
                    // Add Price Button
                    const addBtn = document.getElementById('addPriceBtn');
                    if (addBtn) {
                        addBtn.onclick = () => {
                            console.log("Add Price clicked!");
                            document.getElementById('addPriceModal').classList.remove('hidden');
                        };
                    }
                    
                    // Profile Buttons
                    document.querySelectorAll('.profile-btn').forEach(btn => {
                        btn.onclick = (e) => {
                            console.log("Profile clicked:", e.currentTarget.dataset.profile);
                            const profile = e.currentTarget.dataset.profile;
                            this.updateUI(profile);
                        };
                    });
                    
                    console.log("App initialized!");
                },
                updateUI: function(profile) {
                    console.log("Updating UI for:", profile);
                    document.body.className = `modo-${profile}`;
                    document.querySelectorAll('.actions-island').forEach(el => el.classList.add('hidden'));
                    const actionsId = profile === 'turista' ? 'touristActions' : 'evaluatorActions';
                    document.getElementById(actionsId).classList.remove('hidden');
                    document.querySelectorAll('.profile-btn').forEach(btn => btn.classList.remove('active'));
                    document.querySelector(`[data-profile="${profile}"]`).classList.add('active');
                }
            }
        };
        
        window.closeModal = function(id) {
            console.log("Closing modal:", id);
            document.getElementById(id).classList.add('hidden');
        };
        
        window.submitQuestion = function() {
            console.log("Submitting question...");
            const product = document.getElementById('productQuestion').value;
            if (product) {
                GringoSafe.utils.showNotification('Pergunta enviada!');
                closeModal('askPriceModal');
                document.getElementById('productQuestion').value = '';
            } else {
                GringoSafe.utils.showNotification('Preencha o produto!');
            }
        };
        
        window.submitPrice = function() {
            console.log("Submitting price...");
            const name = document.getElementById('productName').value;
            const price = document.getElementById('productPrice').value;
            if (name && price) {
                GringoSafe.utils.showNotification('Preço adicionado!');
                closeModal('addPriceModal');
                document.getElementById('productName').value = '';
                document.getElementById('productPrice').value = '';
            } else {
                GringoSafe.utils.showNotification('Preencha todos os campos!');
            }
        };
        
        // Initialize when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => GringoSafe.app.init());
        } else {
            GringoSafe.app.init();
        }
    </script>
</body>
</html>
